name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run offer-items
      - run: npm run offer-change-estimator
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          umask 077
          startup_log=$(mktemp)
          trap 'rm -f "$startup_log"' EXIT
          if ! supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor > "$startup_log" 2>&1; then
            echo 'Local Supabase startup failed; private command output omitted.' >&2
            exit 1
          fi
          if ! supabase status -o env > supabase.env 2> "$startup_log"; then
            echo 'Local Supabase status unavailable; private command output omitted.' >&2
            exit 1
          fi
      - name: Prepare dedicated local E2E user and app credentials
        run: node scripts/ci-e2e-env.mjs prepare
      - name: Run offer contract test against local Supabase
        run: |
          set -a
          source supabase.env
          set +a
          npm run offer-contract
      - run: npm run build
      - name: Run smoke test with local Worker harness
        run: |
          set -a
          source supabase.env
          set +a
          SMOKE_TRANSPORT=harness npm run smoke
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run full browser suite against local Supabase
        run: npm run e2e
        env:
          CI: "true"
      - name: Clean dedicated test user and private configuration
        if: always()
        run: |
          trap 'rm -f supabase.env playwright/.auth/user.json' EXIT
          node scripts/ci-e2e-env.mjs cleanup
      - if: always()
        run: supabase stop --no-backup > /dev/null 2>&1
